name: Build AmneziaWG Packages & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Выберите версию OpenWrt'
        required: true
        type: choice
        default: '24.10.3'
        options:
          - '25.12.5'
          - '25.12.4'
          - '25.12.3'
          - '25.12.2'
          - '25.12.1'
          - '25.12.0'
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
          - '23.05.6'
          - '23.05.5'
          - '23.05.4'
          - '23.05.3'
          - '23.05.2'
          - '23.05.1'
          - '23.05.0'
          - 'custom'
      custom_version:
        description: 'Кастомная версия OpenWrt (если в списке выбрано custom, например 24.10.3)'
        required: false
        type: string
      targets:
        description: 'Фильтр по Target (через запятую, например: ramips,mediatek). Оставьте пустым для сборки ВСЕХ платформ.'
        required: false
        type: string
      subtargets:
        description: 'Фильтр по Subtarget (через запятую, например: mt7621,filogic). Оставьте пустым для сборки ВСЕХ платформ.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-config:
    name: "Generate Build Matrix"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      job-config: ${{ steps.generate-config.outputs.job-config }}
      tag_name: ${{ steps.version-step.outputs.tag_name }}
      version: ${{ steps.version-step.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve OpenWRT Version & Tag
        id: version-step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.version }}" = "custom" ]; then
              if [ -z "${{ inputs.custom_version }}" ]; then
                echo "::error::Необходимо указать custom_version, если выбрано custom!"
                exit 1
              fi
              RAW_VER="${{ inputs.custom_version }}"
            else
              RAW_VER="${{ inputs.version }}"
            fi
            
            VER="${RAW_VER#v}"
            TAG="v${VER}"

            echo "VERSION=${VER}" >> $GITHUB_ENV
            echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

            if [ -n "${{ inputs.targets }}" ]; then
              echo "TARGETS=${{ inputs.targets }}" >> $GITHUB_ENV
            fi

            if [ -n "${{ inputs.subtargets }}" ]; then
              echo "SUBTARGETS=${{ inputs.subtargets }}" >> $GITHUB_ENV
            fi

          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            RAW_TAG="${{ inputs.tag_name }}"
            VER="${RAW_TAG#v}"
            TAG="v${VER}"
            echo "VERSION=${VER}" >> $GITHUB_ENV
            echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

          else
            VER="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
            echo "VERSION=${VER}" >> $GITHUB_ENV
            echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
            echo "version=${VER}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Job Config
        id: generate-config
        run: node index.js ${{ env.VERSION }} "${{ env.TARGETS }}" "${{ env.SUBTARGETS }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Initialize Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AmneziaWG ${{ env.TAG_NAME }} (OpenWrt ${{ env.VERSION }})
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: "${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}} (${{ matrix.build_env.pkgarch}})"
    runs-on: ubuntu-latest
    needs: generate-config
    permissions:
      contents: write
    strategy:
      matrix:
        build_env: ${{ fromJson(needs.generate-config.outputs.job-config) }}
      fail-fast: false

    steps:
      - name: Checkout AWG source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools zstd build-essential rsync

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        env:
          cache-name: "cache-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target}}-${{ matrix.build_env.subtarget}}"
        with:
          path: openwrt-sdk-*/
          key: ${{ runner.os }}-sdk-${{ env.cache-name }}

      - name: Download and extract OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          echo "pkgarch: ${{ matrix.build_env.pkgarch}}, target: ${{ matrix.build_env.target}}, subtarget: ${{ matrix.build_env.subtarget}}"

          SDK_FILE=$(curl -s "https://downloads.openwrt.org/releases/${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}}/" | grep -o "openwrt-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target}}-${{ matrix.build_env.subtarget}}_gcc-[^\"]*_musl[^\"]*\.Linux-x86_64\.tar\.[xz|zst]*" | head -n1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK файл не найден для ${{ matrix.build_env.tag }} ${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}}"
            exit 1
          fi
          
          SDK_DOWNLOAD_URL="https://downloads.openwrt.org/releases/${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}}/${SDK_FILE}"
          echo "Downloading SDK: $SDK_DOWNLOAD_URL"
          
          wget -q --show-progress "$SDK_DOWNLOAD_URL"
          
          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar --zstd -xf "$SDK_FILE"
          elif [[ "$SDK_FILE" == *.tar.xz ]]; then
            tar -xf "$SDK_FILE"
          else
            echo "::error::Неизвестный формат архива: $SDK_FILE"
            exit 1
          fi
          
          rm -f "$SDK_FILE"

      - name: Setup SDK and feeds
        run: |
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -n1)
          
          if [ -z "$SDK_DIR" ]; then
            echo "::error::SDK директория не найдена"
            exit 1
          fi
          
          WORKSPACE_DIR=$(pwd)
          cd "$SDK_DIR"
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          cp -r "$WORKSPACE_DIR/kmod-amneziawg" package/
          cp -r "$WORKSPACE_DIR/amneziawg-tools" package/
          cp -r "$WORKSPACE_DIR/luci-proto-amneziawg" package/
          
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" > .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y" >> .config
          
          make defconfig

      - name: Build AmneziaWG packages
        run: |
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -n1)
          cd "$SDK_DIR"

          echo "Собираю kmod-amneziawg..."
          make package/kmod-amneziawg/{download,prepare} V=s || true
          make package/kmod-amneziawg/compile V=s || true

          echo "Собираю luci-proto-amneziawg..."
          make package/luci-proto-amneziawg/{download,prepare} V=s
          make package/luci-proto-amneziawg/compile V=s

          echo "Собираю amneziawg-tools..."
          make package/amneziawg-tools/{download,prepare} V=s
          make package/amneziawg-tools/compile V=s
          
          echo "Сборка завершена. Проверка сгенерированных пакетов:"
          find bin/ -name "*.?pk" | grep -E "(amneziawg|luci-proto-amneziawg|luci-i18n-amneziawg)" || true

      - name: Prepare artifacts for release
        run: |
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -n1)
          
          mkdir -p awgrelease
          postfix="v${{ matrix.build_env.tag }}_${{ matrix.build_env.pkgarch}}_${{ matrix.build_env.target}}_${{ matrix.build_env.subtarget}}"
          
          find "$SDK_DIR/bin/packages" -name "amneziawg-tools*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/amneziawg-tools_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "amneziawg-tools не найден"
          find "$SDK_DIR/bin/packages" -name "luci-proto-amneziawg*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-proto-amneziawg_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "luci-proto-amneziawg не найден"
          find "$SDK_DIR/bin/packages" -name "luci-i18n-amneziawg-ru*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-i18n-amneziawg-ru_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "luci-i18n-amneziawg-ru не найден"
          find "$SDK_DIR/bin/targets" -name "kmod-amneziawg*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/kmod-amneziawg_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "kmod-amneziawg не найден"
          
          echo "Готовые пакеты к выгрузке:"
          ls -la awgrelease/

      - name: Upload Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: awgrelease/*.?pk
          tag_name: ${{ needs.generate-config.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
